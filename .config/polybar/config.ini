; ============================================================================
; Polybar - Xorg/i3 counterpart to ~/.config/waybar/config.jsonc
;
; Layout, colors and module order intentionally mirror the Waybar setup:
;   left:   workspaces, window title
;   right:  battery, ethernet, local IP, date, time
; Bar is bottom-anchored, 34px high, semi-transparent #161C23 with a
; 2px #292D35 top border.
; ============================================================================

[colors]
background = #EA161C23
background-alt = #292D35
foreground = #C5C7D6
foreground-alt = #9C9BAA
foreground-bright = #FFFFFF
window = #DAD4E1
ethernet = #ABA6A6
accent = #596478
border = #9C9BAA
good = #98C379
warning = #E5C07B
critical = #C73E3E

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false
bottom = true
fixed-center = true

width = 100%
; 30px content + 2px border on each side = 34px total, matching Waybar
height = 30
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1
border-size = 2
border-color = ${colors.background-alt}

padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font Mono:size=12;3"
font-1 = "JetBrainsMono Nerd Font Mono:style=Bold:size=12;3"

modules-left = i3 xwindow
modules-center =
modules-right = battery ethernet localip date time

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ---------------------------------------------------------------------------
; Workspaces (Waybar: hyprland/workspaces, format "{name}")
; ---------------------------------------------------------------------------
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
pin-workspaces = false
strip-wsnumbers = false
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false

label-mode = %mode%
label-mode-background = ${colors.critical}
label-mode-foreground = ${colors.foreground-bright}
label-mode-padding = 8px
label-mode-margin = 2px

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.foreground-bright}
label-focused-underline = ${colors.border}
label-focused-padding = 8px
label-focused-margin = 2px

label-unfocused = %name%
label-unfocused-background = ${colors.background-alt}
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 8px
label-unfocused-margin = 2px

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.foreground-alt}
label-visible-padding = 8px
label-visible-margin = 2px

label-urgent = %name%
label-urgent-background = ${colors.critical}
label-urgent-foreground = ${colors.foreground-bright}
label-urgent-padding = 8px
label-urgent-margin = 2px

label-separator =

; ---------------------------------------------------------------------------
; Window title (Waybar: hyprland/window, max-length 50)
; Polybar does not shrink the left block to make room for the right block, so
; an over-long title pushes the clock off the screen. 35 chars leaves enough
; room for the workspace buttons plus the right-hand modules.
; ---------------------------------------------------------------------------
[module/xwindow]
type = internal/xwindow
format = <label>
label = %title:0:35:...%
label-foreground = ${colors.window}
label-padding = 12px
label-margin = 2px
label-empty =

; ---------------------------------------------------------------------------
; Battery (Waybar: battery, BAT0/ADP0, 11-step icon ramp)
; Custom script so the "plugged in but not charging" state matches Waybar.
; ---------------------------------------------------------------------------
[module/battery]
type = custom/script
exec = /home/guh/.config/polybar/scripts/battery.sh
interval = 30
format = <label>
label = %output%
label-foreground = ${colors.foreground-alt}
label-padding = 10px
label-margin = 2px

; ---------------------------------------------------------------------------
; Ethernet (Waybar: custom/ethernet)
; ---------------------------------------------------------------------------
[module/ethernet]
type = custom/script
exec = /home/guh/.config/polybar/scripts/ethernet.sh
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.ethernet}
label-padding = 10px
label-margin = 2px

; ---------------------------------------------------------------------------
; Local IPv4 (Waybar: custom/localip)
; ---------------------------------------------------------------------------
[module/localip]
type = custom/script
exec = /home/guh/.config/polybar/scripts/localip.sh
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.foreground-alt}
label-padding = 10px
label-margin = 2px

; ---------------------------------------------------------------------------
; Date (Waybar: clock#date)
; ---------------------------------------------------------------------------
[module/date]
type = internal/date
interval = 60
date = 󰃭 %a %d %b
date-alt = 󰃭 %a %d %b %Y
label = %date%
label-foreground = ${colors.window}
label-padding = 10px
label-margin = 2px

; ---------------------------------------------------------------------------
; Time (Waybar: clock#time)
; Matches the muted clock/status-module styling instead of Waybar's white bold.
; ---------------------------------------------------------------------------
[module/time]
type = internal/date
interval = 30
date = 󰥔 %I:%M %p
date-alt = 󰥔 %I:%M:%S %p
label = %date%
label-foreground = ${colors.window}
label-padding = 10px
label-margin = 2px

[settings]
screenchange-reload = true
