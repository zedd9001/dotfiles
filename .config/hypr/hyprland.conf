# ==========================================
# Hyprland 0.56.2
# Sway rice converted to Hyprland
# ==========================================

$mod = SUPER
$term = alacritty
$menu = rofi -show run


# ==========================================
# Monitor
# ==========================================

monitor = ,preferred,auto,1


# ==========================================
# General
# ==========================================

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    layout = dwindle
    allow_tearing = false
}


# ==========================================
# Decoration
# ==========================================

decoration {
    rounding = 0

    blur {
        enabled = false
    }
}


# ==========================================
# Animations
# ==========================================

animations {
    enabled = true

    animation = windows, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}


# ==========================================
# Input
# ==========================================

input {
    # Focus is keyboard/click driven only: switching apps (workspaces,
    # movefocus) never moves the mouse and hovering never steals focus.
    follow_mouse = 0

    # Mouse acceleration
    accel_profile = adaptive
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = false
    }
}


# ==========================================
# Layout
# ==========================================

dwindle {
    preserve_split = true
}


# ==========================================
# Startup
# ==========================================

# hyprpaper needs the output/GPU ready at boot; without the delay it exits
# if it sees no monitors yet (hyprtoolkit build). Small sleep fixes the race.
exec-once = sleep 2 && hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = swaync
exec-once = firefox


# ==========================================
# Applications
# ==========================================

bind = $mod, RETURN, exec, $term
bind = $mod, B, exec, firefox
bind = $mod, X, exec, dolphin
bind = $mod, D, exec, $menu


# ==========================================
# Lock
# ==========================================

bind = $mod, DELETE, exec, hyprlock


# ==========================================
# Kill window
# ==========================================

bind = $mod SHIFT, Q, killactive


# ==========================================
# Focus
# ==========================================

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod, LEFT, movefocus, l
bind = $mod, DOWN, movefocus, d
bind = $mod, UP, movefocus, u
bind = $mod, RIGHT, movefocus, r


# ==========================================
# Move windows
# ==========================================

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, DOWN, movewindow, d
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, RIGHT, movewindow, r


# ==========================================
# Layout
# ==========================================

bind = $mod, F, layoutmsg, togglesplit
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, O, fullscreen
bind = $mod SHIFT, SPACE, togglefloating


# ==========================================
# Workspaces
# ==========================================

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10


# ==========================================
# Move to workspace
# ==========================================

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10


# ==========================================
# Named workspaces
# ==========================================

workspace = 1, defaultName:1: Terminals
workspace = 2, defaultName:2: General
workspace = 3, defaultName:3: Browser
workspace = 9, defaultName:9: Processes


# ==========================================
# Application assignments
# ==========================================

windowrule = workspace 3, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(VirtualBox Manager)$


# ==========================================
# Screenshot
# ==========================================

bind = , END, exec, grim -g "$(slurp)" - | wl-copy


# ==========================================
# GPU screen recorder
# ==========================================

bind = $mod SHIFT, R, exec, killall -USR1 gpu-screen-recorder


# ==========================================
# Resize mode
# ==========================================

bind = $mod, R, submap, resize

submap = resize

binde = , H, resizeactive, -100 0
binde = , J, resizeactive, 0 100
binde = , K, resizeactive, 0 -100
binde = , L, resizeactive, 100 0

binde = , LEFT, resizeactive, -100 0
binde = , DOWN, resizeactive, 0 100
binde = , UP, resizeactive, 0 -100
binde = , RIGHT, resizeactive, 100 0

bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset

submap = reset


# ==========================================
# Audio
# ==========================================

bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , SCROLL_LOCK, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , PAUSE, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , PRINT, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle


# ==========================================
# Brightness
# ==========================================

bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+